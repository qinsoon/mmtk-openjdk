includes:
  - "../base.yml"

# NoGC never collects, so a heap factor relative to the min heap does not make sense.
# We run it with a fixed heap size instead (run this config without `-s`).
# GitHub-hosted arm64 runners have 16GB of memory.
modifiers:
  nogc_heap:
    type: JVMArg
    val: "-Xms12G -Xmx12G"

# Compressed oops are not supported on aarch64 yet, so every config uses `no_compressed_oops`.
configs:
  - "jdk21-master|dacapochopin_jdk21|ms|s|fail_on_oom|tph|preserve|no_compressed_oops|nogc_heap|mmtk_gc-NoGC"

# This will be expanded in CI when we run with the config. Keep a new line at the end.
benchmarks:
  dacapochopin:
